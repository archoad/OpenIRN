name: Release signée Android / Windows / Apple

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de release à publier, par exemple v1.3.0'
        required: true
        type: string
      prerelease:
        description: 'Marquer la release comme pré-release'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-signed-${{ github.ref }}-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable
  APP_NAME: openirn
  APP_DISPLAY_NAME: OpenIRN
  APP_BUNDLE_ID: io.archoad.openirn
  PUBLISHER_SUBJECT: 'CN=Archoad, O=Archoad, L=Noyen-sur-Sarthe, S=Sarthe, C=FR'
  MSIX_IDENTITY_NAME: Archoad.OpenIRN
  STORE_MSIX_IDENTITY_NAME: archoadFR.OpenIRN
  STORE_MSIX_PUBLISHER: 'CN=0C16A5BC-1E9E-4174-A14C-FD52C54BD219'
  STORE_MSIX_PUBLISHER_DISPLAY_NAME: 'archoad FR'
  STORE_MSIX_PFN: archoadFR.OpenIRN_40n6zg9mmw8te
  STORE_MSIX_PACKAGE_SID: S-1-15-2-1093717781-299261422-2075608443-880705312-3180602753-3190663317-2185964278
  MICROSOFT_STORE_PRODUCT_ID: 9N63P1KPCMMZ
  MSIX_LOGO_PATH: 'windows\runner\resources\msix_logo.png'
  ARTIFACT_SIGNING_ENDPOINT: https://neu.codesigning.azure.net/
  ARTIFACT_SIGNING_ACCOUNT: openirnsign
  ARTIFACT_SIGNING_PROFILE: openirn-public

jobs:
  validate:
    name: Qualité et contrôles publication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Check release tag and Flutter version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          PUB_VERSION="$(awk '/^version:/ {print $2; exit}' flutter/pubspec.yaml)"
          PUB_VERSION="${PUB_VERSION%%+*}"
          if [[ "${TAG_NAME#v}" != "$PUB_VERSION" ]]; then
            echo "Tag ${TAG_NAME} incohérent avec flutter/pubspec.yaml (${PUB_VERSION})" >&2
            exit 1
          fi
          echo "Release ${TAG_NAME} cohérente avec la version Flutter ${PUB_VERSION}"

      - name: Check formatting
        working-directory: flutter
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Open source readiness
        run: |
          chmod +x tools/check_open_source_readiness.sh
          ./tools/check_open_source_readiness.sh

      - name: Check signing workflow files
        run: |
          chmod +x tools/check_release_signing_setup.sh
          ./tools/check_release_signing_setup.sh

  android:
    name: Android signé APK et AAB
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Prepare Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Secret GitHub manquant : ${name}" >&2
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > flutter/android/app/openirn-upload-keystore.jks
          cat > flutter/android/key.properties <<EOF_SIGNING
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/openirn-upload-keystore.jks
          EOF_SIGNING
          chmod 600 flutter/android/app/openirn-upload-keystore.jks flutter/android/key.properties

      - name: Build signed Android APK
        working-directory: flutter
        run: flutter build apk --release

      - name: Build signed Android App Bundle
        working-directory: flutter
        run: flutter build appbundle --release

      - name: Prepare Android artifacts
        run: |
          mkdir -p release_artifacts
          cp flutter/build/app/outputs/flutter-apk/app-release.apk release_artifacts/openirn-android.apk
          cp flutter/build/app/outputs/bundle/release/app-release.aab release_artifacts/openirn-android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openirn-android-signed
          path: release_artifacts/openirn-android.*
          if-no-files-found: error

  ios_app_store:
    name: Signature et envoi iOS App Store Connect
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    environment: apple-store
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Check Apple configuration
        shell: bash
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_P8 \
            IOS_DISTRIBUTION_P12_BASE64 \
            IOS_DISTRIBUTION_P12_PASSWORD \
            IOS_APP_STORE_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Configuration GitHub Apple manquante : ${name}" >&2
              exit 1
            fi
          done

      - name: Install iOS signing assets
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/ios-distribution.p12"
          profile_path="$RUNNER_TEMP/openirn-ios.mobileprovision"
          profile_plist="$RUNNER_TEMP/openirn-ios-profile.plist"
          keychain_path="$RUNNER_TEMP/openirn-ios-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode -o "$certificate_path"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 --decode -o "$profile_path"
          chmod 600 "$certificate_path" "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          if ! security cms -D -i "$profile_path" > "$profile_plist" 2>/dev/null; then
            openssl smime -inform der -verify -noverify \
              -in "$profile_path" -out "$profile_plist" 2>/dev/null
          fi
          plutil -lint "$profile_plist"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          expected_app_id="${APPLE_TEAM_ID}.${APP_BUNDLE_ID}"
          if [[ "$profile_app_id" != "$expected_app_id" ]]; then
            echo "Le profil iOS ne correspond pas à ${APP_BUNDLE_ID}." >&2
            exit 1
          fi

          profile_certificate="$RUNNER_TEMP/openirn-ios-profile-certificate.der"
          plutil -extract DeveloperCertificates.0 raw -o - "$profile_plist" |
            base64 --decode -o "$profile_certificate"
          profile_certificate_sha1="$(
            openssl x509 -inform der -in "$profile_certificate" -noout -fingerprint -sha1 |
              cut -d= -f2 | tr -d ':'
          )"
          distribution_certificate_sha1="$(
            openssl pkcs12 -legacy \
              -in "$certificate_path" \
              -clcerts -nokeys \
              -passin env:IOS_DISTRIBUTION_P12_PASSWORD 2>/dev/null |
              openssl x509 -noout -fingerprint -sha1 |
              cut -d= -f2 | tr -d ':'
          )"
          if [[ -z "$distribution_certificate_sha1" || "$distribution_certificate_sha1" != "$profile_certificate_sha1" ]]; then
            echo "Le certificat iOS ne correspond pas au profil App Store." >&2
            exit 1
          fi

          profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          installed_profile="$profiles_dir/${profile_uuid}.mobileprovision"
          cp "$profile_path" "$installed_profile"

          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "IOS_INSTALLED_PROFILE=$installed_profile" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "IOS_DISTRIBUTION_CERTIFICATE_SHA1=$distribution_certificate_sha1" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"
          if ! grep -q -- 'BEGIN PRIVATE KEY' "$api_key_path"; then
            echo "La clé App Store Connect P8 est invalide." >&2
            exit 1
          fi
          echo "APP_STORE_CONNECT_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Resolve Apple version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw_version="$(awk '/^version:/ {print $2; exit}' flutter/pubspec.yaml)"
          if [[ ! "$raw_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "Version Flutter Apple invalide : ${raw_version}" >&2
            exit 1
          fi
          echo "name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Configure iOS project
        working-directory: flutter
        run: |
          flutter build ios \
            --release \
            --config-only \
            --build-name '${{ steps.version.outputs.name }}' \
            --build-number '${{ steps.version.outputs.number }}'

      - name: Configure iOS Runner signing
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          signing_config="$GITHUB_WORKSPACE/flutter/ios/Flutter/ephemeral/CI-AppStore.xcconfig"
          mkdir -p "$(dirname "$signing_config")"
          umask 077
          {
            printf 'CODE_SIGN_STYLE = Manual\n'
            printf 'CODE_SIGN_IDENTITY = %s\n' "$IOS_DISTRIBUTION_CERTIFICATE_SHA1"
            printf 'PROVISIONING_PROFILE_SPECIFIER = %s\n' "$IOS_PROFILE_NAME"
            printf 'OTHER_CODE_SIGN_FLAGS = --keychain %s\n' "$APPLE_KEYCHAIN_PATH"
          } > "$signing_config"
          echo "IOS_SIGNING_XCCONFIG=$signing_config" >> "$GITHUB_ENV"

      - name: Archive signed iOS application
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OpenIRN-iOS.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            FLUTTER_BUILD_NAME='${{ steps.version.outputs.name }}' \
            FLUTTER_BUILD_NUMBER='${{ steps.version.outputs.number }}' \
            archive

          ios_app="$(find "$RUNNER_TEMP/OpenIRN-iOS.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$ios_app" ]]; then
            echo "Application iOS absente de l'archive." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$ios_app"

      - name: Upload iOS build to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions-iOS.plist"
          cat > "$export_options" <<EOF_EXPORT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
            <key>signingCertificate</key>
            <string>${IOS_DISTRIBUTION_CERTIFICATE_SHA1}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF_EXPORT
          plutil -lint "$export_options"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenIRN-iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/OpenIRN-iOS-export" \
            -exportOptionsPlist "$export_options" \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          printf 'iOS %s (%s) téléversé dans App Store Connect. La soumission App Review reste manuelle.\n' \
            '${{ steps.version.outputs.name }}' '${{ steps.version.outputs.number }}' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up iOS signing assets
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${APPLE_KEYCHAIN_PATH:-}" && -f "$APPLE_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          fi
          if [[ -n "${IOS_INSTALLED_PROFILE:-}" ]]; then
            rm -f "$IOS_INSTALLED_PROFILE"
          fi
          if [[ -n "${APP_STORE_CONNECT_KEY_PATH:-}" ]]; then
            rm -f "$APP_STORE_CONNECT_KEY_PATH"
          fi
          if [[ -n "${IOS_SIGNING_XCCONFIG:-}" ]]; then
            rm -f "$IOS_SIGNING_XCCONFIG"
          fi

  macos_app_store:
    name: Signature et envoi macOS App Store Connect
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    environment: apple-store
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Check Apple configuration
        shell: bash
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8 }}
          MAC_APP_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_P12_BASE64 }}
          MAC_APP_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_BASE64 }}
          MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD }}
          MAC_APP_STORE_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_P8 \
            MAC_APP_DISTRIBUTION_P12_BASE64 \
            MAC_APP_DISTRIBUTION_P12_PASSWORD \
            MAC_INSTALLER_DISTRIBUTION_P12_BASE64 \
            MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD \
            MAC_APP_STORE_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Configuration GitHub Apple manquante : ${name}" >&2
              exit 1
            fi
          done

      - name: Install macOS signing assets
        shell: bash
        env:
          MAC_APP_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_P12_BASE64 }}
          MAC_APP_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_BASE64 }}
          MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD }}
          MAC_APP_STORE_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          app_certificate_path="$RUNNER_TEMP/mac-app-distribution.p12"
          installer_certificate_path="$RUNNER_TEMP/mac-installer-distribution.p12"
          profile_path="$RUNNER_TEMP/openirn-macos.provisionprofile"
          profile_plist="$RUNNER_TEMP/openirn-macos-profile.plist"
          keychain_path="$RUNNER_TEMP/openirn-macos-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$MAC_APP_DISTRIBUTION_P12_BASE64" | base64 --decode -o "$app_certificate_path"
          printf '%s' "$MAC_INSTALLER_DISTRIBUTION_P12_BASE64" | base64 --decode -o "$installer_certificate_path"
          printf '%s' "$MAC_APP_STORE_PROFILE_BASE64" | base64 --decode -o "$profile_path"
          chmod 600 "$app_certificate_path" "$installer_certificate_path" "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$app_certificate_path" \
            -P "$MAC_APP_DISTRIBUTION_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security import "$installer_certificate_path" \
            -P "$MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          if ! security cms -D -i "$profile_path" > "$profile_plist" 2>/dev/null; then
            openssl smime -inform der -verify -noverify \
              -in "$profile_path" -out "$profile_plist" 2>/dev/null
          fi
          plutil -lint "$profile_plist"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$profile_plist")"
          expected_app_id="${APPLE_TEAM_ID}.${APP_BUNDLE_ID}"
          if [[ "$profile_app_id" != "$expected_app_id" ]]; then
            echo "Le profil macOS ne correspond pas à ${APP_BUNDLE_ID}." >&2
            exit 1
          fi

          profile_certificate="$RUNNER_TEMP/openirn-macos-profile-certificate.der"
          plutil -extract DeveloperCertificates.0 raw -o - "$profile_plist" |
            base64 --decode -o "$profile_certificate"
          profile_certificate_sha1="$(
            openssl x509 -inform der -in "$profile_certificate" -noout -fingerprint -sha1 |
              cut -d= -f2 | tr -d ':'
          )"
          app_distribution_certificate_sha1="$(
            openssl pkcs12 -legacy \
              -in "$app_certificate_path" \
              -clcerts -nokeys \
              -passin env:MAC_APP_DISTRIBUTION_P12_PASSWORD 2>/dev/null |
              openssl x509 -noout -fingerprint -sha1 |
              cut -d= -f2 | tr -d ':'
          )"
          installer_distribution_certificate_sha1="$(
            openssl pkcs12 -legacy \
              -in "$installer_certificate_path" \
              -clcerts -nokeys \
              -passin env:MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD 2>/dev/null |
              openssl x509 -noout -fingerprint -sha1 |
              cut -d= -f2 | tr -d ':'
          )"
          if [[ -z "$app_distribution_certificate_sha1" || "$app_distribution_certificate_sha1" != "$profile_certificate_sha1" ]]; then
            echo "Le certificat Mac App Distribution ne correspond pas au profil App Store." >&2
            exit 1
          fi
          if [[ -z "$installer_distribution_certificate_sha1" ]]; then
            echo "Le certificat Mac Installer Distribution est illisible." >&2
            exit 1
          fi

          profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          installed_profile="$profiles_dir/${profile_uuid}.provisionprofile"
          cp "$profile_path" "$installed_profile"

          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "MACOS_INSTALLED_PROFILE=$installed_profile" >> "$GITHUB_ENV"
          echo "MACOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "MAC_APP_DISTRIBUTION_CERTIFICATE_SHA1=$app_distribution_certificate_sha1" >> "$GITHUB_ENV"
          echo "MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_SHA1=$installer_distribution_certificate_sha1" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"
          if ! grep -q -- 'BEGIN PRIVATE KEY' "$api_key_path"; then
            echo "La clé App Store Connect P8 est invalide." >&2
            exit 1
          fi
          echo "APP_STORE_CONNECT_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Resolve Apple version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw_version="$(awk '/^version:/ {print $2; exit}' flutter/pubspec.yaml)"
          if [[ ! "$raw_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "Version Flutter Apple invalide : ${raw_version}" >&2
            exit 1
          fi
          echo "name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Configure macOS project
        working-directory: flutter
        run: |
          flutter build macos \
            --release \
            --config-only \
            --build-name '${{ steps.version.outputs.name }}' \
            --build-number '${{ steps.version.outputs.number }}'

      - name: Configure macOS Runner signing
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          signing_config="$GITHUB_WORKSPACE/flutter/macos/Flutter/ephemeral/CI-AppStore.xcconfig"
          mkdir -p "$(dirname "$signing_config")"
          umask 077
          {
            printf 'OPENIRN_CODE_SIGN_STYLE = Manual\n'
            printf 'OPENIRN_CODE_SIGN_IDENTITY = %s\n' "$MAC_APP_DISTRIBUTION_CERTIFICATE_SHA1"
            printf 'OPENIRN_PROVISIONING_PROFILE_SPECIFIER = %s\n' "$MACOS_PROFILE_NAME"
            printf 'OPENIRN_OTHER_CODE_SIGN_FLAGS = --keychain %s\n' "$APPLE_KEYCHAIN_PATH"
          } > "$signing_config"
          echo "MACOS_SIGNING_XCCONFIG=$signing_config" >> "$GITHUB_ENV"

      - name: Archive signed universal macOS application
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/OpenIRN-macOS.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            FLUTTER_BUILD_NAME='${{ steps.version.outputs.name }}' \
            FLUTTER_BUILD_NUMBER='${{ steps.version.outputs.number }}' \
            archive

          macos_app="$(find "$RUNNER_TEMP/OpenIRN-macOS.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$macos_app" ]]; then
            echo "Application macOS absente de l'archive." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$macos_app"

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$macos_app/Contents/Info.plist")"
          architectures="$(lipo -archs "$macos_app/Contents/MacOS/$executable_name")"
          if [[ " $architectures " != *' arm64 '* || " $architectures " != *' x86_64 '* ]]; then
            echo "Archive macOS non universelle : ${architectures}" >&2
            exit 1
          fi

          unreadable_file="$(find "$macos_app" -type f ! -perm -004 -print -quit)"
          untraversable_dir="$(find "$macos_app" -type d ! -perm -001 -print -quit)"
          if [[ -n "$unreadable_file" || -n "$untraversable_dir" ]]; then
            echo "Permissions incompatibles avec la distribution macOS." >&2
            exit 1
          fi

      - name: Upload macOS build to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions-macOS.plist"
          cat > "$export_options" <<EOF_EXPORT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>installerSigningCertificate</key>
            <string>${MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_SHA1}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${MACOS_PROFILE_NAME}</string>
            </dict>
            <key>signingCertificate</key>
            <string>${MAC_APP_DISTRIBUTION_CERTIFICATE_SHA1}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF_EXPORT
          plutil -lint "$export_options"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenIRN-macOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/OpenIRN-macOS-export" \
            -exportOptionsPlist "$export_options" \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          printf 'macOS %s (%s) téléversé dans App Store Connect. La soumission App Review reste manuelle.\n' \
            '${{ steps.version.outputs.name }}' '${{ steps.version.outputs.number }}' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up macOS signing assets
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${APPLE_KEYCHAIN_PATH:-}" && -f "$APPLE_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          fi
          if [[ -n "${MACOS_INSTALLED_PROFILE:-}" ]]; then
            rm -f "$MACOS_INSTALLED_PROFILE"
          fi
          if [[ -n "${APP_STORE_CONNECT_KEY_PATH:-}" ]]; then
            rm -f "$APP_STORE_CONNECT_KEY_PATH"
          fi
          if [[ -n "${MACOS_SIGNING_XCCONFIG:-}" ]]; then
            rm -f "$MACOS_SIGNING_XCCONFIG"
          fi

  windows:
    name: Windows signé Artifact Signing
    needs: validate
    runs-on: windows-2025
    environment: artifact-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows app
        working-directory: flutter
        run: flutter build windows --release

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign OpenIRN executable
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\flutter\build\windows\x64\runner\Release\OpenIRN.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify executable signature
        shell: pwsh
        run: |
          $file = "${{ github.workspace }}\flutter\build\windows\x64\runner\Release\OpenIRN.exe"
          $sig = Get-AuthenticodeSignature $file
          Write-Host "Status  :" $sig.Status
          Write-Host "Subject :" $sig.SignerCertificate.Subject
          Write-Host "Issuer  :" $sig.SignerCertificate.Issuer
          if ($sig.Status -ne "Valid") {
            throw "OpenIRN.exe signature is not valid"
          }
          if ($sig.SignerCertificate.Subject -ne $env:PUBLISHER_SUBJECT) {
            throw "Unexpected signer subject: $($sig.SignerCertificate.Subject)"
          }

      - name: Determine MSIX version
        working-directory: flutter
        shell: pwsh
        run: |
          $versionLine = Get-Content pubspec.yaml |
            Where-Object { $_ -match '^\s*version:\s*([0-9]+)\.([0-9]+)\.([0-9]+)(?:\+([0-9]+))?\s*$' } |
            Select-Object -First 1
          if (-not $versionLine) {
            throw "Unable to find a Flutter version in pubspec.yaml"
          }
          $null = $versionLine -match '^\s*version:\s*([0-9]+)\.([0-9]+)\.([0-9]+)(?:\+([0-9]+))?\s*$'
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3]
          $build = if ($Matches[4]) { [int]$Matches[4] } else { 0 }
          foreach ($part in @($major, $minor, $patch, $build)) {
            if ($part -lt 0 -or $part -gt 65535) {
              throw "MSIX version component out of range (0..65535): $part"
            }
          }
          $msixVersion = "$major.$minor.$patch.$build"
          $storeMsixVersion = "$major.$minor.$patch.0"
          Write-Host "Direct MSIX version         : $msixVersion"
          Write-Host "Microsoft Store MSIX version: $storeMsixVersion"
          "MSIX_VERSION=$msixVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STORE_MSIX_VERSION=$storeMsixVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create unsigned MSIX
        working-directory: flutter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build\windows\msix" | Out-Null
          if (-not (Test-Path -LiteralPath $env:MSIX_LOGO_PATH -PathType Leaf)) {
            throw "OpenIRN MSIX logo not found: $env:MSIX_LOGO_PATH"
          }
          Get-Item -LiteralPath $env:MSIX_LOGO_PATH | Format-List FullName, Length
          dart run msix:create `
            --build-windows false `
            --sign-msix false `
            --install-certificate false `
            --architecture x64 `
            --display-name "OpenIRN" `
            --publisher-display-name "Archoad" `
            --identity-name "$env:MSIX_IDENTITY_NAME" `
            --publisher "$env:PUBLISHER_SUBJECT" `
            --version "$env:MSIX_VERSION" `
            --logo-path "$env:MSIX_LOGO_PATH" `
            --output-path "build\windows\msix" `
            --output-name "OpenIRN"
          $msix = "build\windows\msix\OpenIRN.msix"
          if (-not (Test-Path $msix)) {
            Get-ChildItem "build\windows\msix" -Recurse | Format-Table FullName, Length
            throw "Expected MSIX not found: $msix"
          }
          Get-Item $msix | Format-List FullName, Length, LastWriteTime

      - name: Inspect MSIX manifest before signing
        shell: pwsh
        run: |
          $msix = "${{ github.workspace }}\flutter\build\windows\msix\OpenIRN.msix"
          $unpack = Join-Path $env:RUNNER_TEMP "openirn-msix-unpacked"
          if (Test-Path $unpack) {
            Remove-Item $unpack -Recurse -Force
          }
          $makeAppx = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse `
            -Filter makeappx.exe `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) {
            throw "makeappx.exe not found on runner"
          }
          Write-Host "MakeAppx: $($makeAppx.FullName)"
          & $makeAppx.FullName unpack /p $msix /d $unpack /o
          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx unpack failed with exit code $LASTEXITCODE"
          }
          [xml]$manifest = Get-Content (Join-Path $unpack "AppxManifest.xml")
          $identity = $manifest.Package.Identity
          Write-Host "Identity Name :" $identity.Name
          Write-Host "Publisher     :" $identity.Publisher
          Write-Host "Version       :" $identity.Version
          Write-Host "Architecture  :" $identity.ProcessorArchitecture
          if ($identity.Name -ne $env:MSIX_IDENTITY_NAME) {
            throw "Unexpected MSIX identity name: $($identity.Name)"
          }
          if ($identity.Publisher -ne $env:PUBLISHER_SUBJECT) {
            throw "MSIX Publisher does not match Artifact Signing certificate subject"
          }
          if ($identity.Version -ne $env:MSIX_VERSION) {
            throw "Unexpected MSIX version: $($identity.Version)"
          }
          $storeLogo = $manifest.SelectSingleNode(
            "/*[local-name()='Package']/*[local-name()='Properties']/*[local-name()='Logo']"
          )
          $visualElements = $manifest.SelectSingleNode(
            "/*[local-name()='Package']/*[local-name()='Applications']/*[local-name()='Application']/*[local-name()='VisualElements']"
          )
          if (-not $storeLogo -or -not $visualElements) {
            throw "Expected MSIX logo declarations are missing from AppxManifest.xml"
          }
          $requiredIconPaths = @(
            [string]$storeLogo.InnerText,
            [string]$visualElements.GetAttribute("Square150x150Logo"),
            [string]$visualElements.GetAttribute("Square44x44Logo"),
            "Images\Square44x44Logo.targetsize-256.png"
          )
          foreach ($iconPath in $requiredIconPaths) {
            if ([string]::IsNullOrWhiteSpace($iconPath)) {
              throw "An expected MSIX icon path is missing from AppxManifest.xml"
            }
            $iconDirectory = Join-Path $unpack (Split-Path $iconPath -Parent)
            $iconBaseName = [System.IO.Path]::GetFileNameWithoutExtension($iconPath)
            $iconExtension = [System.IO.Path]::GetExtension($iconPath)
            $qualifiedIconFiles = @(
              Get-ChildItem -LiteralPath $iconDirectory -File -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -eq "${iconBaseName}${iconExtension}" -or
                  $_.Name -like "${iconBaseName}.scale-*${iconExtension}"
                }
            )
            if ($qualifiedIconFiles.Count -eq 0) {
              throw "Expected MSIX icon is missing: $iconPath"
            }
            foreach ($iconInfo in $qualifiedIconFiles) {
              if ($iconInfo.Length -le 0) {
                throw "Expected MSIX icon is empty: $($iconInfo.FullName)"
              }
              $relativeIconPath = $iconInfo.FullName.Substring($unpack.Length + 1)
              Write-Host "MSIX icon      : $relativeIconPath ($($iconInfo.Length) bytes)"
            }
          }
          & "${{ github.workspace }}\tools\Test-MsixIconTransparency.ps1" -PackageRoot $unpack

      - name: Sign OpenIRN MSIX
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\flutter\build\windows\msix\OpenIRN.msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify MSIX signature
        shell: pwsh
        run: |
          $msix = "${{ github.workspace }}\flutter\build\windows\msix\OpenIRN.msix"
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse `
            -Filter signtool.exe `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "signtool.exe not found on runner"
          }
          Write-Host "SignTool: $($signTool.FullName)"
          & $signTool.FullName verify /pa /v $msix
          if ($LASTEXITCODE -ne 0) {
            throw "MSIX signature verification failed with exit code $LASTEXITCODE"
          }

      - name: Create Microsoft Store MSIX
        working-directory: flutter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build\windows\msix-store" | Out-Null
          if (-not (Test-Path -LiteralPath $env:MSIX_LOGO_PATH -PathType Leaf)) {
            throw "OpenIRN Microsoft Store logo not found: $env:MSIX_LOGO_PATH"
          }
          dart run msix:create `
            --build-windows false `
            --sign-msix false `
            --install-certificate false `
            --store `
            --architecture x64 `
            --display-name "OpenIRN" `
            --publisher-display-name "$env:STORE_MSIX_PUBLISHER_DISPLAY_NAME" `
            --identity-name "$env:STORE_MSIX_IDENTITY_NAME" `
            --publisher "$env:STORE_MSIX_PUBLISHER" `
            --version "$env:STORE_MSIX_VERSION" `
            --logo-path "$env:MSIX_LOGO_PATH" `
            --output-path "build\windows\msix-store" `
            --output-name "OpenIRN-Store"
          $storeMsix = "build\windows\msix-store\OpenIRN-Store.msix"
          if (-not (Test-Path -LiteralPath $storeMsix -PathType Leaf)) {
            Get-ChildItem "build\windows\msix-store" -Recurse | Format-Table FullName, Length
            throw "Expected Microsoft Store MSIX not found: $storeMsix"
          }
          Get-Item -LiteralPath $storeMsix | Format-List FullName, Length, LastWriteTime

      - name: Inspect Microsoft Store MSIX identity
        shell: pwsh
        run: |
          $storeMsix = "${{ github.workspace }}\flutter\build\windows\msix-store\OpenIRN-Store.msix"
          $unpack = Join-Path $env:RUNNER_TEMP "openirn-store-msix-unpacked"
          if (Test-Path $unpack) {
            Remove-Item $unpack -Recurse -Force
          }
          $makeAppx = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse `
            -Filter makeappx.exe `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) {
            throw "makeappx.exe not found on runner"
          }
          & $makeAppx.FullName unpack /p $storeMsix /d $unpack /o
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store MSIX unpack failed with exit code $LASTEXITCODE"
          }
          [xml]$manifest = Get-Content (Join-Path $unpack "AppxManifest.xml")
          $identity = $manifest.Package.Identity
          $publisherDisplayName = $manifest.SelectSingleNode(
            "/*[local-name()='Package']/*[local-name()='Properties']/*[local-name()='PublisherDisplayName']"
          )
          Write-Host "Identity Name         :" $identity.Name
          Write-Host "Publisher             :" $identity.Publisher
          Write-Host "Publisher display name:" $publisherDisplayName.InnerText
          Write-Host "Version               :" $identity.Version
          Write-Host "Architecture          :" $identity.ProcessorArchitecture
          Write-Host "Expected PFN          :" $env:STORE_MSIX_PFN
          Write-Host "Expected package SID  :" $env:STORE_MSIX_PACKAGE_SID
          if ($identity.Name -ne $env:STORE_MSIX_IDENTITY_NAME) {
            throw "Unexpected Microsoft Store identity name: $($identity.Name)"
          }
          if ($identity.Publisher -ne $env:STORE_MSIX_PUBLISHER) {
            throw "Unexpected Microsoft Store publisher: $($identity.Publisher)"
          }
          if (-not $publisherDisplayName -or $publisherDisplayName.InnerText -ne $env:STORE_MSIX_PUBLISHER_DISPLAY_NAME) {
            throw "Unexpected Microsoft Store publisher display name"
          }
          if ($identity.Version -ne $env:STORE_MSIX_VERSION) {
            throw "Unexpected Microsoft Store MSIX version: $($identity.Version)"
          }
          if (Test-Path (Join-Path $unpack "AppxSignature.p7x")) {
            throw "The Microsoft Store submission package must be unsigned; the Store signs it after certification"
          }
          & "${{ github.workspace }}\tools\Test-MsixIconTransparency.ps1" -PackageRoot $unpack

      - name: Prepare Windows release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_artifacts | Out-Null
          Copy-Item `
            LICENSE `
            flutter\build\windows\x64\runner\Release\LICENSE.txt `
            -Force
          Compress-Archive `
            -Path flutter\build\windows\x64\runner\Release\* `
            -DestinationPath release_artifacts\openirn-windows-signed.zip `
            -Force
          Copy-Item `
            flutter\build\windows\msix\OpenIRN.msix `
            release_artifacts\openirn-windows-x64.msix `
            -Force
          Get-ChildItem release_artifacts | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openirn-windows-signed
          path: |
            release_artifacts/openirn-windows-signed.zip
            release_artifacts/openirn-windows-x64.msix
          if-no-files-found: error

      - name: Upload Microsoft Store submission package
        uses: actions/upload-artifact@v4
        with:
          name: openirn-windows-store-submission
          path: flutter/build/windows/msix-store/OpenIRN-Store.msix
          if-no-files-found: error
          retention-days: 14

  microsoft_store:
    name: Soumission Microsoft Store
    needs: windows
    runs-on: windows-2025
    environment: microsoft-store
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref }}

      - name: Download Microsoft Store submission package
        uses: actions/download-artifact@v4
        with:
          name: openirn-windows-store-submission
          path: store_submission

      - name: Validate Microsoft Store publication settings
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $required = @{
            PARTNER_CENTER_TENANT_ID = $env:PARTNER_CENTER_TENANT_ID
            PARTNER_CENTER_SELLER_ID = $env:PARTNER_CENTER_SELLER_ID
            PARTNER_CENTER_CLIENT_ID = $env:PARTNER_CENTER_CLIENT_ID
            PARTNER_CENTER_CLIENT_SECRET = $env:PARTNER_CENTER_CLIENT_SECRET
            MICROSOFT_STORE_PRODUCT_ID = $env:MICROSOFT_STORE_PRODUCT_ID
          }
          $missing = @(
            $required.GetEnumerator() |
              Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } |
              ForEach-Object { $_.Key }
          )
          if ($missing.Count -gt 0) {
            throw "Microsoft Store configuration missing: $($missing -join ', ')"
          }
          $storeMsix = Get-ChildItem store_submission -Recurse -Filter *.msix |
            Select-Object -First 1
          if (-not $storeMsix) {
            throw "Microsoft Store MSIX artifact not found"
          }
          Write-Host "Microsoft Store package ready:" $storeMsix.Name

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Microsoft Store Developer CLI
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId "$env:PARTNER_CENTER_TENANT_ID" `
            --sellerId "$env:PARTNER_CENTER_SELLER_ID" `
            --clientId "$env:PARTNER_CENTER_CLIENT_ID" `
            --clientSecret "$env:PARTNER_CENTER_CLIENT_SECRET"
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store Developer CLI configuration failed with exit code $LASTEXITCODE"
          }
          msstore settings --enableTelemetry false
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store Developer CLI settings failed with exit code $LASTEXITCODE"
          }

      - name: Publish package to Microsoft Store
        shell: pwsh
        run: |
          $storeMsix = Get-ChildItem store_submission -Recurse -Filter *.msix |
            Select-Object -First 1
          if (-not $storeMsix) {
            throw "Microsoft Store MSIX artifact not found"
          }
          msstore publish "${{ github.workspace }}\flutter" `
            --inputDirectory "$($storeMsix.Directory.FullName)" `
            --appId "$env:MICROSOFT_STORE_PRODUCT_ID"
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store submission failed with exit code $LASTEXITCODE"
          }
          "Microsoft Store submission committed for product $env:MICROSOFT_STORE_PRODUCT_ID." |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY

  documentation:
    name: Documentation PDF OpenIRN
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref }}

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            lmodern \
            pandoc \
            texlive-fonts-recommended \
            texlive-xetex \
            texlive-latex-extra \
            zip

      - name: Build OpenIRN documentation
        env:
          DOC_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
        run: |
          chmod +x tools/build_docs.sh
          ./tools/build_docs.sh

      - name: Upload bilingual documentation archive
        uses: actions/upload-artifact@v4
        with:
          name: openirn-documentation-fr-en
          path: docs/pdf/openirn-documentation-fr-en.zip
          if-no-files-found: error

  publish:
    name: Publier la release GitHub
    needs:
      - validate
      - android
      - ios_app_store
      - macos_app_store
      - windows
      - microsoft_store
      - documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref }}

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: openirn-android-signed
          path: downloaded_artifacts/android

      - name: Download direct Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: openirn-windows-signed
          path: downloaded_artifacts/windows

      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: openirn-documentation-fr-en
          path: downloaded_artifacts/documentation

      - name: Flatten artifacts
        run: |
          mkdir -p release_artifacts
          find downloaded_artifacts -maxdepth 3 -type f -print -exec cp {} release_artifacts/ \;
          cp LICENSE release_artifacts/LICENSE.txt
          ls -lh release_artifacts

      - name: Generate checksums
        run: |
          cd release_artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release notes
        run: |
          cat > release_notes.md <<'EOF_NOTES'
          # OpenIRN release signée

          Cette release contient les artefacts OpenIRN générés par GitHub Actions avec signature de distribution Android et Windows. Les builds iOS et macOS correspondants sont signés puis téléversés séparément dans App Store Connect.

          ## Artefacts

          - `openirn-android.apk` : APK Android signé.
          - `openirn-android.aab` : Android App Bundle signé pour Google Play.
          - `openirn-windows-signed.zip` : distribution Windows portable avec `OpenIRN.exe` signé.
          - `openirn-windows-x64.msix` : package MSIX x64 signé et horodaté.
          - `openirn-documentation-fr-en.zip` : les quatre guides français et leurs quatre versions anglaises au format PDF.
          - `LICENSE.txt` : licence du code correspondant au tag publié.
          - `SHA256SUMS.txt` : empreintes SHA-256 des artefacts.

          ## Signature Windows

          Les artefacts Windows sont signés avec Azure Artifact Signing, profil Public Trust `openirn-public`, au nom de `Archoad`. Les signatures utilisent SHA-256 et le service d'horodatage Microsoft.

          Un second MSIX est construit avec l’identité Partner Center `archoadFR.OpenIRN` et soumis automatiquement au produit Microsoft Store `9N63P1KPCMMZ`. Après certification, Microsoft Store signe lui-même ce package avant sa distribution.

          ## macOS et iOS

          Les builds macOS et iOS sont signés pour l'App Store et téléversés automatiquement dans App Store Connect. Ils ne sont pas joints à la GitHub Release et leur soumission à App Review reste une opération manuelle.

          ## Sécurité

          La clé privée de signature Windows n'est ni exportée ni stockée dans GitHub. GitHub Actions s'authentifie auprès de Microsoft Entra par OIDC avec un jeton de courte durée. Les secrets Android, Apple et les identifiants d'automatisation Partner Center restent protégés dans leurs environnements GitHub respectifs.
          EOF_NOTES

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release_artifacts/* --clobber
            gh release edit "$TAG_NAME" --notes-file release_notes.md --prerelease="$PRERELEASE"
          else
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release create "$TAG_NAME" release_artifacts/* \
                --title "OpenIRN ${TAG_NAME}" \
                --notes-file release_notes.md \
                --prerelease
            else
              gh release create "$TAG_NAME" release_artifacts/* \
                --title "OpenIRN ${TAG_NAME}" \
                --notes-file release_notes.md
            fi
          fi
