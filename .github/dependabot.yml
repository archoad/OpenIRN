version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "pub"
    directory: "/flutter"
    schedule:
      interval: "weekly"
    ignore:
      # La version 11 impose Android compileSdk 37, qui n'est pas encore pris
      # en charge par la chaîne Flutter/Android actuelle d'OpenIRN.
      - dependency-name: "flutter_secure_storage"
        versions:
          - ">=11.0.0 <12.0.0"
    labels:
      - "dependencies"
      - "flutter"

  - package-ecosystem: "pip"
    directory: "/server/openirn-api"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
