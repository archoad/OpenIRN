version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "pub"
    directory: "/flutter"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "flutter"

  - package-ecosystem: "pip"
    directory: "/server/openirn-api"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
